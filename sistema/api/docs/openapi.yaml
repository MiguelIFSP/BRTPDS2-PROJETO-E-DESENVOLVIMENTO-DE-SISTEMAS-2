openapi: 3.0.3
info:
  title: Better Meet — API de Dados
  version: 1.0.0
  description: |
    API de dados do Better Meet: usuários, organizações e comissões.

    **Autenticação (Better Auth, em `/auth/*`):** cadastro, confirmação de
    e-mail, login, recuperação de senha, logout e sessão. As rotas marcadas com
    o cadeado exigem `Authorization: Bearer <token>`, com o valor do cabeçalho
    `set-auth-token` devolvido por `POST /auth/sign-in/email` (sessão de 7
    dias). No navegador vale também o cookie de sessão. `GET /usuarios/me`
    valida a sessão e devolve o perfil atual.

    **Limite de tentativas:** o excesso responde 429 com o cabeçalho
    `X-Retry-After` (segundos) e `{ "error": "Muitas tentativas. Tente
    novamente em N segundos." }`. Fica ligado em produção (ou com
    `RATE_LIMIT_ENABLED=true`).

    **Corpo da requisição:** até 1 MB (maior responde 413).

    **Erros:** toda resposta de erro tem o corpo `{ "error": "mensagem" }`;
    as rotas `/auth/*` acrescentam `message` (igual) e `code` (código do
    Better Auth, como `EMAIL_NOT_VERIFIED`).
    Ids de URL malformados devolvem 400 antes de qualquer checagem de
    permissão (ordem: 400 → 403 → 404).

    **E-mails das reuniões** (só com GMAIL_USER e GMAIL_APP_PASSWORD no .env;
    saem depois da resposta e uma falha de envio não altera o resultado da rota):
    convite com .ics para quem é convidado (POST /reunioes e
    POST /reunioes/{id}/convites); aviso com .ics atualizado quando a reunião
    muda (PATCH /reunioes/{id}); aviso com .ics de cancelamento na exclusão
    (DELETE /reunioes/{id}); e lembretes às 07h do dia (se a reunião começar
    depois das 08h), 1 hora e 15 minutos antes, para o criador e quem aceitou.
    Datas e horários são lidos no fuso TZ_REUNIOES (padrão America/Sao_Paulo).
servers:
  - url: /api
tags:
  - name: Autenticação
  - name: Usuários
  - name: Organizações
  - name: Comissões
  - name: Reuniões
  - name: Votações
  - name: Notificações

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Valor do cabeçalho `set-auth-token` do login (token de sessão do Better Auth).

  parameters:
    UsuarioId:
      name: id
      in: path
      required: true
      description: Id do próprio usuário autenticado (`requireSelf`).
      schema: { type: integer, minimum: 1 }
    OrganizacaoId:
      name: id
      in: path
      required: true
      description: Id da organização.
      schema: { type: integer, minimum: 1 }
    OrganizacaoIdComissoes:
      name: organizacaoId
      in: path
      required: true
      description: Id da organização.
      schema: { type: integer, minimum: 1 }
    ComissaoId:
      name: comissaoId
      in: path
      required: true
      description: Id da comissão.
      schema: { type: integer, minimum: 1 }
    MembroUserId:
      name: userId
      in: path
      required: true
      description: Id do usuário membro.
      schema: { type: integer, minimum: 1 }

  responses:
    BadRequest:
      description: Dados ou id inválidos.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Limite de tentativas excedido. O cabeçalho `X-Retry-After` traz os segundos de espera.
      headers:
        X-Retry-After:
          description: Segundos até poder tentar de novo.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Sem token, token inválido ou expirado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Autenticado, mas sem permissão.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Gone:
      description: O recurso já terminou e não aceita mais a ação (votação encerrada, convite de reunião encerrada).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflito (duplicidade, limite de papel ou regra de estado).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Erro inesperado. A mensagem é sempre genérica.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Ata:
      type: object
      required:
        [
          reuniaoId,
          titulo,
          dataReuniao,
          conteudoAta,
          versaoAta,
          papelNaComissao,
          podeEditar,
          podeVotar,
          meuVoto,
          votos,
          presentes,
          aprovada,
          exportada,
          exportadaAt,
          podeExportar,
        ]
      properties:
        presentes:
          type: integer
          minimum: 0
          description: Pessoas com entrada registrada na reunião (base da maioria simples).
        aprovada:
          type: boolean
          description: Calculada, nunca gravada. Mais da metade dos presentes aprovou a versão atual; a metade exata não aprova.
        exportada: { type: boolean }
        exportadaAt: { type: string, format: date-time, nullable: true }
        podeExportar:
          { type: boolean, description: Verdadeiro com a ata aprovada. }
        reuniaoId: { type: integer }
        titulo: { type: string }
        dataReuniao:
          type: string
          format: date
          example: '2026-11-11'
          description: Data da reunião (AAAA-MM-DD), sem conversão de fuso horário.
        conteudoAta:
          type: string
          nullable: true
          description: HTML sanitizado; nulo enquanto a ata não foi redigida.
        versaoAta:
          type: integer
          minimum: 0
          description: Enviar esta versão na edição e no voto. Zero antes da primeira gravação.
        papelNaComissao:
          type: string
          enum: [ADMINISTRADOR, FACILITADOR, SECRETARIO, MEMBRO]
        podeEditar: { type: boolean, description: Falso depois da exportação. }
        podeVotar:
          {
            type: boolean,
            description: Falso sem ata salva e depois da exportação.,
          }
        meuVoto:
          type: string
          nullable: true
          enum: [APROVADO, REPROVADO, null]
        votos:
          type: object
          required: [aprovados, reprovados]
          properties:
            aprovados: { type: integer, minimum: 0 }
            reprovados: { type: integer, minimum: 0 }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: Organização não encontrada. }
    ErroAuth:
      type: object
      required: [error]
      properties:
        error: { type: string, example: E-mail ou senha inválidos. }
        message: { type: string, description: Igual a `error`. }
        code:
          {
            type: string,
            example: INVALID_EMAIL_OR_PASSWORD,
            description: Código do Better Auth.,
          }
    UsuarioAuth:
      type: object
      description: Usuário no formato do Better Auth (o id vem como texto).
      properties:
        id: { type: string, example: '12' }
        name: { type: string }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        image: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/Role' }
        themePreference: { $ref: '#/components/schemas/Tema' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SessaoAuth:
      type: object
      properties:
        redirect: { type: boolean, example: false }
        token:
          {
            type: string,
            description: Valor bruto da sessão; use o cabeçalho `set-auth-token` como Bearer.,
          }
        user: { $ref: '#/components/schemas/UsuarioAuth' }
    UsuarioMe:
      type: object
      required:
        [id, name, email, role, emailVerified, themePreference, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        emailVerified: { type: boolean }
        themePreference:
          allOf: [{ $ref: '#/components/schemas/Tema' }]
          nullable: true
        createdAt: { type: string, format: date-time }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string, example: Operação concluída com sucesso. }
    Role:
      type: string
      enum: [USER, ADMIN]
    Tema:
      type: string
      enum: [light, dark, system]
    PapelOrganizacao:
      type: string
      enum: [CRIADOR, GERENTE, MODERADOR, MEMBRO]
      description: |
        CRIADOR: quem pediu a organização (só 1). GERENTE: máximo 1, adiciona e
        remove membros. MODERADOR: máximo 2, só adiciona membros.
    StatusOrganizacao:
      type: string
      enum: [PENDENTE, ACEITA, RECUSADA]
    StatusPedidoAcesso:
      type: string
      enum: [PENDENTE, ACEITO, RECUSADO]
      description: |
        Pedido para entrar numa organização já aceita. RECUSADO pode voltar
        para PENDENTE se a pessoa solicitar de novo.
    PapelComissao:
      type: string
      enum: [ADMINISTRADOR, FACILITADOR, SECRETARIO, MEMBRO]
    StatusReuniao:
      type: string
      enum: [AGENDADA, REALIZADA, CANCELADA]
    StatusConviteReuniao:
      type: string
      enum: [PENDENTE, ACEITO, RECUSADO]
    Reuniao:
      type: object
      properties:
        id: { type: integer }
        comissaoId: { type: integer }
        titulo: { type: string }
        pauta: { type: string }
        descricao: { type: string, nullable: true }
        local:
          type: string
          nullable: true
          description: Endereço, link da chamada ou os dois. Nulo só em reuniões anteriores ao campo.
        data: { type: string, format: date }
        horaInicio: { type: string, example: '14:00' }
        horaFim: { type: string, example: '15:00' }
        status: { $ref: '#/components/schemas/StatusReuniao' }
        criadoPorUserId:
          type: integer
          nullable: true
          description: Nulo quando a conta de quem criou foi excluída; o app mostra "usuário removido".
        usuario:
          type: string
          nullable: true
          description: Nome de quem criou; nulo quando a conta foi excluída. Presente em GET /reunioes/{id} e /reunioes/minhas.
        estado: { $ref: '#/components/schemas/EstadoReuniao' }
        podeGerirPresenca:
          type: boolean
          description: Indica ADMINISTRADOR atual da comissão; autoriza consultar código e registrar por outros participantes. Presente nas consultas da reunião.
        janelaCheckIn:
          type: object
          description: Instantes em UTC. `abre` coincide com o início. `fecha` mantém a referência legada de 30 minutos depois do fim; não limita saídas atrasadas. Novas entradas próprias encerram no fim previsto da reunião.
          properties:
            abre: { type: string, format: date-time }
            fecha: { type: string, format: date-time }
        comissao:
          type: object
          properties:
            id: { type: integer }
            nome: { type: string }
        convites:
          type: array
          description: |
            Todos os convites da reunião, inclusive pendentes e recusados. Em
            GET /reunioes/minhas também traz `userId` e `nome` do convidado.
          items:
            type: object
            properties:
              id: { type: integer }
              userId: { type: integer }
              nome: { type: string }
              status: { $ref: '#/components/schemas/StatusConviteReuniao' }
        meuRegistro:
          description: Presença do próprio usuário, incluída em GET /reunioes/minhas.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/ReuniaoRegistro' }]
        participantes:
          type: array
          description: Criador e membros que aceitaram o convite, com o estado de presença de cada um.
          items:
            type: object
            required: [userId, nome, email, papel, registro]
            properties:
              userId: { type: integer }
              nome: { type: string }
              email: { type: string, format: email }
              papel: { $ref: '#/components/schemas/PapelComissao' }
              registro:
                nullable: true
                allOf: [{ $ref: '#/components/schemas/ReuniaoRegistro' }]
    ReuniaoRegistro:
      type: object
      required: [id, reuniaoId, userId, entradaAt, saidaAt]
      properties:
        id: { type: integer }
        reuniaoId: { type: integer }
        userId: { type: integer }
        entradaAt:
          type: string
          format: date-time
          description: Horário da primeira entrada, gerado pelo servidor.
        saidaAt: { type: string, format: date-time, nullable: true }
        origemEntrada: { type: string, enum: [PROPRIO, MANUAL] }
        origemSaida: { type: string, nullable: true, enum: [PROPRIO, MANUAL] }
        entradaManualPorId: { type: integer, nullable: true }
        saidaManualPorId: { type: integer, nullable: true }
    EntradaReuniao:
      type: object
      required: [message, registro, jaRegistrado]
      properties:
        message: { type: string }
        registro: { $ref: '#/components/schemas/ReuniaoRegistro' }
        jaRegistrado: { type: boolean }
    ConviteReuniao:
      type: object
      properties:
        id: { type: integer }
        reuniaoId: { type: integer }
        titulo: { type: string }
        pauta: { type: string }
        descricao: { type: string, nullable: true }
        local:
          type: string
          nullable: true
          description: Endereço, link da chamada ou os dois. Nulo só em reuniões anteriores ao campo.
        data: { type: string, format: date }
        horaInicio: { type: string, example: '14:00' }
        horaFim: { type: string, example: '15:00' }
        usuario:
          type: string
          nullable: true
          description: Nome de quem criou a reunião; nulo quando a conta foi excluída.
        status: { $ref: '#/components/schemas/StatusConviteReuniao' }
        comissao: { type: string }
    EstadoReuniao:
      type: string
      enum: [CANCELADA, AGUARDANDO, CHECKIN_ABERTO, EM_ANDAMENTO, ENCERRADA]
      description: Calculado pelo horário no fuso das reuniões. A entrada abre no início; CHECKIN_ABERTO permanece no contrato por compatibilidade e não é mais emitido.
    TipoVotacao:
      type: string
      enum: [ABERTA, SECRETA]
      description: ABERTA mostra quem votou em quê a quem gere; SECRETA nunca liga voto e pessoa.
    VotacaoCriacao:
      type: object
      required: [titulo, opcoes, tipo]
      properties:
        titulo: { type: string, minLength: 3, maxLength: 120 }
        opcoes:
          type: array
          minItems: 2
          maxItems: 6
          items: { type: string, maxLength: 80 }
        tipo: { $ref: '#/components/schemas/TipoVotacao' }
        mostrarParcial:
          {
            type: boolean,
            default: false,
            description: Falso esconde os totais por opção até o encerramento.,
          }
        permiteTrocaVoto: { type: boolean, default: false }
    RelatorioVotacao:
      type: object
      required: [reuniao, votacoes]
      properties:
        reuniao:
          type: object
          required: [id, titulo, comissao, data, horaInicio, horaFim]
          properties:
            id: { type: integer }
            titulo: { type: string }
            comissao: { type: string }
            data: { type: string, description: Data AAAA-MM-DD no fuso da reunião. }
            horaInicio: { type: string }
            horaFim: { type: string }
        votacoes:
          type: array
          items: { $ref: '#/components/schemas/Votacao' }
    VotacaoResumo:
      type: object
      properties:
        id: { type: integer }
        titulo: { type: string }
        tipo: { $ref: '#/components/schemas/TipoVotacao' }
        encerrada: { type: boolean }
        createdAt: { type: string, format: date-time }
        totalVotos: { type: integer, minimum: 0 }
        votei: { type: boolean }
    Votacao:
      type: object
      properties:
        id: { type: integer }
        reuniaoId: { type: integer }
        titulo: { type: string }
        tipo: { $ref: '#/components/schemas/TipoVotacao' }
        mostrarParcial: { type: boolean }
        permiteTrocaVoto: { type: boolean }
        encerrada:
          {
            type: boolean,
            description: Verdadeiro também quando a reunião terminou ou foi cancelada.,
          }
        createdAt: { type: string, format: date-time }
        reuniao:
          type: object
          properties:
            id: { type: integer }
            titulo: { type: string }
        podeGerir: { type: boolean }
        totalVotos: { type: integer, minimum: 0 }
        votei: { type: boolean }
        meuVotoOpcaoId: { type: integer, nullable: true }
        meuVotoNulo: { type: boolean }
        podeVotar:
          type: boolean
          description: Participante presente, reunião em andamento, votação aberta e, se já votou, com troca de voto permitida.
        nulos:
          type: integer
          minimum: 0
          description: Votos nulos. Ausente enquanto o parcial está oculto.
        opcoes:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              texto: { type: string }
              votos:
                type: integer
                description: Ausente enquanto o parcial está oculto (`mostrarParcial` falso e votação aberta).
              votantes:
                type: array
                description: Só em votação ABERTA, para quem gere e com o resultado visível. Nunca em SECRETA.
                items:
                  type: object
                  properties:
                    userId: { type: integer }
                    nome: { type: string }
    TipoNotificacao:
      type: string
      enum: [REUNIAO_ATUALIZADA, REUNIAO_EXCLUIDA]
    Notificacao:
      type: object
      required: [id, tipo, titulo, mensagem, reuniaoId, lidaAt, createdAt]
      properties:
        id: { type: integer }
        tipo: { $ref: '#/components/schemas/TipoNotificacao' }
        titulo: { type: string, example: Reunião remarcada }
        mensagem: { type: string }
        reuniaoId:
          type: integer
          nullable: true
          description: Pode apontar para uma reunião que já foi excluída.
        lidaAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    UsuarioResumo:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
    Usuario:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        emailVerified: { type: boolean }
        themePreference:
          allOf: [{ $ref: '#/components/schemas/Tema' }]
          nullable: true
        createdAt: { type: string, format: date-time }
    OrganizacaoMembro:
      type: object
      properties:
        organizacaoId: { type: integer }
        userId: { type: integer }
        papel: { $ref: '#/components/schemas/PapelOrganizacao' }
        user: { $ref: '#/components/schemas/UsuarioResumo' }
    Comissao:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        descricao: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        organizacaoId: { type: integer }
    ComissaoEquipe:
      type: object
      properties:
        comissaoId: { type: integer }
        userId: { type: integer }
        papel: { $ref: '#/components/schemas/PapelComissao' }
    Organizacao:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        status: { $ref: '#/components/schemas/StatusOrganizacao' }
        createdAt: { type: string, format: date-time }
        membros:
          type: array
          description: Ordenados por papel (criador primeiro) e depois por nome.
          items: { $ref: '#/components/schemas/OrganizacaoMembro' }
        comissoes:
          type: array
          items: { $ref: '#/components/schemas/Comissao' }
    OrganizacaoDisponivel:
      type: object
      required: [id, nome, pedido]
      properties:
        id: { type: integer }
        nome: { type: string }
        pedido:
          nullable: true
          allOf:
            - type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/StatusPedidoAcesso' }
    PedidoAcessoOrganizacao:
      type: object
      properties:
        id: { type: integer }
        organizacaoId: { type: integer }
        userId: { type: integer }
        status: { $ref: '#/components/schemas/StatusPedidoAcesso' }
        createdAt: { type: string, format: date-time }
        respondidoAt: { type: string, format: date-time, nullable: true }
        user: { $ref: '#/components/schemas/UsuarioResumo' }
    CrescimentoMes:
      type: object
      properties:
        mes: { type: string, example: '2026-10', description: Ano-mês em UTC. }
        quantidade: { type: integer }
    Pendente:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        organizacaoId:
          type: integer
          description: Só nas comissões pendentes.
        membros:
          type: array
          description: Quem pode ser escolhido como sucessor.
          items: { $ref: '#/components/schemas/UsuarioResumo' }
    Sucessores:
      type: object
      description: Mapa id (organização ou comissão) → id do sucessor.
      additionalProperties: { type: integer, minimum: 1 }
      example: { '3': 12 }
    RelatorioOrganizacoes:
      type: object
      properties:
        total: { type: integer }
        porStatus:
          type: object
          properties:
            PENDENTE: { type: integer }
            ACEITA: { type: integer }
            RECUSADA: { type: integer }
        crescimentoPorMes:
          type: array
          description: Últimos 12 meses, do mais antigo ao mais recente.
          items: { $ref: '#/components/schemas/CrescimentoMes' }
        distribuicaoPapeis:
          type: object
          description: Só organizações ACEITAS.
          additionalProperties: { type: integer }
        mediaMembrosPorOrganizacao:
          type: number
          description: Só organizações ACEITAS.
    RelatorioComissoes:
      type: object
      properties:
        total: { type: integer }
        totalOrganizacoes: { type: integer }
        porOrganizacao:
          type: array
          items:
            type: object
            properties:
              organizacaoId: { type: integer }
              nome: { type: string }
              quantidade: { type: integer }
        crescimentoPorMes:
          type: array
          description: Últimos 12 meses, do mais antigo ao mais recente.
          items: { $ref: '#/components/schemas/CrescimentoMes' }
        distribuicaoPapeis:
          type: object
          additionalProperties: { type: integer }
        mediaMembrosPorComissao: { type: number }
        comissoes:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              nome: { type: string }
              descricao: { type: string, nullable: true }
              createdAt: { type: string, format: date-time }
              organizacao:
                type: object
                properties:
                  id: { type: integer }
                  nome: { type: string }
              membros: { type: integer, description: Tamanho da equipe. }

paths:
  /auth/sign-up/email:
    post:
      tags: [Autenticação]
      summary: Cadastra uma conta (Better Auth)
      description: |
        Pública. Cria a conta como `USER`, com o e-mail **não confirmado**, e
        envia o link de confirmação (vale 1 hora). **Não abre sessão**: o
        `token` da resposta é sempre nulo e o login só funciona depois da
        confirmação.

        Cadastro com e-mail já existente responde **igual** (200, mesmo
        formato), sem revelar a conta; o dono recebe um aviso por e-mail.
        O campo `role` não é aceito: enviá-lo devolve 400. Limite: 5 por hora
        por IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                email: { type: string, format: email, maxLength: 160 }
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                  description: Precisa de maiúscula, minúscula e número.
                callbackURL:
                  type: string
                  description: |
                    Para onde o link de confirmação redireciona (por exemplo
                    `bettermeet://`); precisa ser uma origem confiável.
      responses:
        '200':
          description: Conta criada (ou resposta idêntica, se o e-mail já existia).
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, nullable: true, example: null }
                  user: { $ref: '#/components/schemas/UsuarioAuth' }
        '400':
          description: Nome ou senha inválidos, ou campo não permitido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroAuth' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/sign-in/email:
    post:
      tags: [Autenticação]
      summary: Entra com e-mail e senha (Better Auth)
      description: |
        Pública. Só o e-mail identifica a conta (o nome não funciona). Conta
        com e-mail não confirmado recebe 403 e um novo link. Limite: 5 por
        minuto por IP.

        O token de sessão vem **no cabeçalho `set-auth-token`** (assinado) e
        deve ser enviado nas próximas chamadas como
        `Authorization: Bearer <valor de set-auth-token>`. O `token` do corpo
        é o valor bruto da sessão e não deve ser usado como Bearer. A sessão
        dura 7 dias, renovada se usada depois de 1 dia.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Autenticado.
          headers:
            set-auth-token:
              description: 'Token de sessão para o `Authorization: Bearer`.'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoAuth' }
        '400':
          description: E-mail inválido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroAuth' }
        '401':
          description: E-mail ou senha inválidos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroAuth' }
        '403':
          description: E-mail não confirmado (`EMAIL_NOT_VERIFIED`); um novo link foi enviado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroAuth' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/send-verification-email:
    post:
      tags: [Autenticação]
      summary: Reenvia o link de confirmação do e-mail
      description: |
        Pública. Responde 200 igual para e-mail cadastrado, inexistente ou já
        confirmado. Limite: 3 por 5 minutos por IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                callbackURL: { type: string }
      responses:
        '200':
          description: Pedido recebido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean, example: true }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/verify-email:
    get:
      tags: [Autenticação]
      summary: Confirma o e-mail pelo link recebido
      description: |
        Pública; é o link do e-mail. Com `callbackURL`, redireciona (302) para
        ele e, se o token for inválido ou vencido, acrescenta `?error=invalid_token`.
        Sem `callbackURL`, responde 200 ou 400. Vale também para a confirmação
        de troca de e-mail (`PATCH /usuarios/{id}`). Limite: 20 por minuto por IP.
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
        - {
            name: callbackURL,
            in: query,
            required: false,
            schema: { type: string },
          }
      responses:
        '200':
          description: E-mail confirmado.
        '302':
          description: Redireciona para o `callbackURL`.
        '400':
          description: Link inválido ou vencido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroAuth' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/request-password-reset:
    post:
      tags: [Autenticação]
      summary: Pede o e-mail de redefinição de senha (UC02)
      description: |
        Pública. Responde sempre o mesmo corpo e status, exista a conta ou não,
        e o e-mail sai fora do caminho da resposta. O e-mail traz o botão e o
        **token em texto** (vale 30 minutos, uso único) para colar no app. Conta
        que só entra com o Google recebe um aviso, sem token. Limite: 3 por 15
        minutos por IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                redirectTo:
                  type: string
                  description: Para onde o link do e-mail redireciona com `?token=`.
      responses:
        '200':
          description: Pedido recebido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean, example: true }
                  message: { type: string }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/reset-password:
    post:
      tags: [Autenticação]
      summary: Redefine a senha com o token do e-mail
      description: |
        Pública. Exige o token enviado ao e-mail cadastrado; sem token (ou com
        token vencido ou já usado) responde 400. Ao concluir, encerra todas as
        sessões e envia o aviso "sua senha foi alterada". Limite: 5 por 15
        minutos por IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 72
                  description: Precisa de maiúscula, minúscula e número.
      responses:
        '200':
          description: Senha redefinida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean, example: true }
        '400':
          description: Token inválido, vencido ou já usado, ou senha fraca.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroAuth' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/reset-password/{token}:
    get:
      tags: [Autenticação]
      summary: Link do e-mail de redefinição
      description: |
        Pública. Valida o token e redireciona (302) para `callbackURL` com
        `?token=` ou, se inválido, com `?error=INVALID_TOKEN`. Limite: 20 por
        minuto por IP.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - {
            name: callbackURL,
            in: query,
            required: true,
            schema: { type: string },
          }
      responses:
        '302':
          description: Redireciona para o `callbackURL`.
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/sign-in/social:
    post:
      tags: [Autenticação]
      summary: Entra com o Google
      description: |
        Pública. Só existe com `GOOGLE_CLIENT_ID` e `GOOGLE_CLIENT_SECRET`
        configurados; sem eles responde 404. A conta é ligada pelo e-mail
        verificado do Google. Limite: 10 por minuto por IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { type: string, enum: [google] }
                callbackURL: { type: string }
      responses:
        '200':
          description: Endereço de login do Google (`url`) ou, com `idToken`, a sessão.
          content:
            application/json:
              schema: { type: object }
        '404':
          description: Login social desligado (sem as chaves do Google).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroAuth' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/sign-out:
    post:
      tags: [Autenticação]
      summary: Encerra a sessão
      description: Remove a sessão do token enviado. É idempotente.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Sessão encerrada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/get-session:
    get:
      tags: [Autenticação]
      summary: Devolve a sessão do token
      description: |
        Sessão e usuário do Better Auth (ids como texto). Para validar uma
        sessão e saber o perfil atual use `GET /usuarios/me`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Sessão atual, ou `null` se não houver.
          content:
            application/json:
              schema: { type: object, nullable: true }

  /usuarios/me:
    get:
      tags: [Usuários]
      summary: Perfil de quem está logado
      description: |
        Exige `requireAuth`, com `Authorization: Bearer <set-auth-token>` ou o
        cookie de sessão. É a rota que monitoring e gestão usam para validar a
        sessão e ler o `role` atual (lido do banco a cada requisição; o
        consumidor pode guardar a resposta por até 30 segundos). Nunca devolve
        senha nem token.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Perfil atual.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioMe' }
        '401':
          description: |
            Sem credencial ("Autenticação necessária.") ou sessão inválida,
            vencida, revogada ou de conta excluída ("Sessão inválida. Entre novamente.").
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /usuarios/busca:
    get:
      tags: [Usuários]
      summary: Busca usuários por nome ou e-mail
      description: >-
        Exige `requireAuth`. Usada para escolher quem adicionar a uma
        organização. Devolve no máximo 10 usuários, em ordem de nome.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          description: Trecho do nome ou do e-mail.
          schema: { type: string, minLength: 2, maxLength: 160 }
        - name: organizacaoId
          in: query
          required: false
          description: Quando informado, deixa de fora quem já é membro dessa organização.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Usuários encontrados.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UsuarioResumo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /usuarios/relatorio:
    get:
      tags: [Usuários]
      summary: Relatório de usuários da plataforma
      description: Exige `requireAuth` + `requireAdmin`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Agregados e lista de usuários.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  porRole:
                    type: object
                    properties:
                      ADMIN: { type: integer }
                      USER: { type: integer }
                  crescimentoPorMes:
                    type: array
                    description: Últimos 12 meses, do mais antigo ao mais recente.
                    items: { $ref: '#/components/schemas/CrescimentoMes' }
                  engajamento:
                    type: object
                    properties:
                      comOrganizacao: { type: integer }
                      semOrganizacao: { type: integer }
                      comComissao: { type: integer }
                      mediaOrganizacoesPorUsuario: { type: number }
                      mediaComissoesPorUsuario: { type: number }
                  usuariosPorPapelOrganizacao:
                    type: object
                    additionalProperties: { type: integer }
                  usuariosPorPapelComissao:
                    type: object
                    additionalProperties: { type: integer }
                  maisAtivos:
                    type: array
                    description: Até 5 usuários com mais vínculos.
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        organizacoes: { type: integer }
                        comissoes: { type: integer }
                  porTema:
                    type: object
                    additionalProperties: { type: integer }
                  usuarios:
                    type: array
                    items: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /usuarios/{id}:
    patch:
      tags: [Usuários]
      summary: Altera nome e e-mail (UC03)
      description: |
        Exige `requireAuth` + `requireSelf`. O nome é gravado na hora. O e-mail
        novo só vale depois de confirmado pelo link enviado a ele (vale 1 hora,
        `GET /auth/verify-email`): até lá a resposta traz o e-mail antigo e
        `emailConfirmacaoPendente: true`, e o antigo continua sendo o login.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UsuarioId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email]
              properties:
                nome: { type: string, minLength: 2, maxLength: 80 }
                email: { type: string, format: email, maxLength: 160 }
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Usuario'
                  - type: object
                    properties:
                      emailConfirmacaoPendente: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: E-mail já cadastrado em outra conta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /usuarios/{id}/senha:
    patch:
      tags: [Usuários]
      summary: Troca a senha (UC01)
      description: |
        Exige `requireAuth` + `requireSelf`. Encerra todas as sessões, inclusive
        a atual, e abre uma nova: o token novo vem no cabeçalho `set-auth-token`
        e no campo `token` e **precisa substituir** o antigo no cliente. Envia
        o aviso "sua senha foi alterada" por e-mail.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UsuarioId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 72
                  description: Precisa de maiúscula, minúscula e número, e ser diferente da atual.
      responses:
        '200':
          description: Senha alterada.
          headers:
            set-auth-token:
              description: Token da nova sessão.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    { type: string, example: Senha alterada com sucesso. }
                  token:
                    {
                      type: string,
                      nullable: true,
                      description: Token da nova sessão.,
                    }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Sem token, token inválido ou senha atual incorreta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /usuarios/{id}/tema:
    patch:
      tags: [Usuários]
      summary: Altera o tema preferido (UC04)
      description: Exige `requireAuth` + `requireSelf`.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UsuarioId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [theme]
              properties:
                theme: { $ref: '#/components/schemas/Tema' }
      responses:
        '200':
          description: Tema atualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  themePreference: { $ref: '#/components/schemas/Tema' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /usuarios/{id}/role:
    patch:
      tags: [Usuários]
      summary: Promove ou rebaixa um usuário na plataforma
      description: |
        Exige `requireAuth` + `requireAdmin`. Usado pela listagem de usuários do
        relatório. O administrador não pode alterar o próprio perfil (403), e a
        plataforma nunca fica sem administrador: rebaixar o último `ADMIN`
        responde 409. A mudança vale na próxima requisição da pessoa, porque o
        `requireAuth` lê o perfil no banco, e não no token.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UsuarioId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: Perfil atualizado. Devolve o usuário sem dados sensíveis.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Quem pediu não é administrador, ou tentou alterar o próprio perfil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: O usuário é o único administrador da plataforma.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /usuarios/{id}/comissoes-administradas:
    get:
      tags: [Usuários]
      summary: Comissões em que o usuário é ADMINISTRADOR
      description: |
        Exige `requireAuth` + `requireSelf`. Usado pela tela de exclusão de
        conta para escolher quem assume cada comissão.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UsuarioId' }]
      responses:
        '200':
          description: Comissões com organização e equipe.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Comissao'
                    - type: object
                      properties:
                        organizacao:
                          type: object
                          properties:
                            id: { type: integer }
                            nome: { type: string }
                        equipe:
                          type: array
                          items:
                            allOf:
                              - $ref: '#/components/schemas/ComissaoEquipe'
                              - type: object
                                properties:
                                  user:
                                    {
                                      $ref: '#/components/schemas/UsuarioResumo',
                                    }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /usuarios/{id}/dados-pessoais:
    delete:
      tags: [Usuários]
      summary: Exclui os dados pessoais, mantendo as organizações
      description: |
        Exige `requireAuth` + `requireSelf`. Cada organização da qual o usuário
        é CRIADOR passa para o sucessor informado em `sucessores`, e cada
        comissão em que ele é o único ADMINISTRADOR passa para o sucessor de
        `sucessoresComissao` (comissão sem outros membros é apagada). Se faltar
        algum sucessor, devolve 409 com as pendências. Tudo é feito numa única
        transação.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UsuarioId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sucessores: { $ref: '#/components/schemas/Sucessores' }
                sucessoresComissao: { $ref: '#/components/schemas/Sucessores' }
      responses:
        '200':
          description: Dados excluídos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            Falta escolher sucessores (com as pendências), ou ainda existem
            reuniões ou votações criadas pelo usuário (só `error`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  organizacoesPendentes:
                    type: array
                    items: { $ref: '#/components/schemas/Pendente' }
                  comissoesPendentes:
                    type: array
                    items: { $ref: '#/components/schemas/Pendente' }
        '500': { $ref: '#/components/responses/InternalError' }

  /usuarios/{id}/dados-completos:
    delete:
      tags: [Usuários]
      summary: Exclui a conta e as organizações das quais é criador
      description: |
        Exige `requireAuth` + `requireSelf`. Apaga o usuário e as organizações
        em que ele é CRIADOR (com membros, comissões e equipes). Comissões de
        outras organizações em que ele é o único ADMINISTRADOR seguem a mesma
        regra de `sucessoresComissao` da exclusão de dados pessoais.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UsuarioId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sucessoresComissao: { $ref: '#/components/schemas/Sucessores' }
      responses:
        '200':
          description: Conta excluída.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            Falta escolher sucessores de comissão (com as pendências), ou ainda
            existem reuniões ou votações criadas pelo usuário em comissões de
            organizações que não são apagadas (só `error`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  comissoesPendentes:
                    type: array
                    items: { $ref: '#/components/schemas/Pendente' }
        '500': { $ref: '#/components/responses/InternalError' }

  /organizacoes:
    get:
      tags: [Organizações]
      summary: Lista todas as organizações
      description: Exige `requireAuth` + `requireAdmin`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Organizações, da mais nova para a mais antiga.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Organizacao' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Organizações]
      summary: Solicita uma organização
      description: |
        Exige `requireAuth`. Cria com status PENDENTE e o solicitante como
        CRIADOR. O admin da plataforma precisa aceitar.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              properties:
                nome: { type: string, maxLength: 80 }
      responses:
        '201':
          description: Organização criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organizacao' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /organizacoes/minhas:
    get:
      tags: [Organizações]
      summary: Organizações das quais o usuário é membro
      description: Exige `requireAuth`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Organizações do usuário.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Organizacao' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /organizacoes/disponiveis:
    get:
      tags: [Organizações]

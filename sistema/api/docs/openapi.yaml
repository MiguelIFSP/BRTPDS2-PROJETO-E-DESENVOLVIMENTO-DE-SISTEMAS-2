      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Organizações disponíveis, em ordem de nome.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrganizacaoDisponivel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /organizacoes/relatorio:
    get:
      tags: [Organizações]
      summary: Relatório de todas as organizações
      description: Exige `requireAuth` + `requireAdmin`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Agregados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelatorioOrganizacoes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /organizacoes/relatorio/minhas:
    get:
      tags: [Organizações]
      summary: Relatório das organizações do usuário
      description: Exige `requireAuth`. Mesmo formato do relatório geral.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Agregados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelatorioOrganizacoes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /organizacoes/{id}:
    get:
      tags: [Organizações]
      summary: Detalha uma organização
      description: |
        Exige `requireAuth`. Só membros da organização ou o ADMIN da
        plataforma.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizacaoId' }]
      responses:
        '200':
          description: Organização com membros e comissões.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organizacao' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Organizações]
      summary: Renomeia uma organização
      description: |
        Exige `requireAuth`. Só o CRIADOR, o GERENTE ou o ADMIN da plataforma.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizacaoId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              properties:
                nome: { type: string, maxLength: 80 }
      responses:
        '200':
          description: Organização atualizada, com membros e comissões.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organizacao' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Organizações]
      summary: Exclui uma organização
      description: |
        Exige `requireAuth`. Só o CRIADOR da organização ou o ADMIN da
        plataforma. Membros, comissões e equipes são apagados junto.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizacaoId' }]
      responses:
        '200':
          description: Organização excluída.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /organizacoes/{id}/status:
    patch:
      tags: [Organizações]
      summary: Aceita ou recusa uma organização
      description: Exige `requireAuth` + `requireAdmin`.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizacaoId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACEITA, RECUSADA] }
      responses:
        '200':
          description: Organização atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organizacao' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /organizacoes/{id}/pedidos:
    get:
      tags: [Organizações]
      summary: Lista os pedidos de acesso pendentes
      description: |
        Exige `requireAuth`. Só o CRIADOR ou o GERENTE da organização aceita.
        O ADMIN da plataforma não analisa pedido só por ser admin.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizacaoId' }]
      responses:
        '200':
          description: Pedidos pendentes, do mais antigo para o mais novo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PedidoAcessoOrganizacao' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Organizações]
      summary: Solicita acesso a uma organização aceita
      description: |
        Exige `requireAuth`. Quem já é membro ou já tem pedido pendente recebe
        409. Pedido recusado (ou aceito de quem foi removido) volta a pendente.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizacaoId' }]
      responses:
        '201':
          description: Pedido pendente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoAcessoOrganizacao' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /organizacoes/{id}/pedidos/{userId}:
    patch:
      tags: [Organizações]
      summary: Aceita ou recusa um pedido de acesso
      description: |
        Exige `requireAuth`. Só o CRIADOR ou o GERENTE. Aceitar inclui a
        pessoa como MEMBRO.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizacaoId' }
        - name: userId
          in: path
          required: true
          description: Id de quem pediu acesso.
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACEITO, RECUSADO] }
      responses:
        '200':
          description: Pedido atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoAcessoOrganizacao' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /organizacoes/{id}/membros:
    post:
      tags: [Organizações]
      summary: Adiciona um membro pelo e-mail
      description: |
        Exige `requireAuth`. A organização precisa estar ACEITA. Só CRIADOR,
        GERENTE, MODERADOR ou o ADMIN da plataforma. O membro entra como MEMBRO.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizacaoId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '201':
          description: Membro adicionado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizacaoMembro' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Organização aprovada ou usuário não encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: O usuário já é membro.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /organizacoes/{id}/membros/{userId}:
    patch:
      tags: [Organizações]
      summary: Promove ou rebaixa um membro
      description: |
        Exige `requireAuth`. Só o CRIADOR (ou o ADMIN da plataforma). Atribuir
        CRIADOR transfere a organização: só o criador atual pode, e ele passa a
        MEMBRO na mesma operação. Limites: 1 GERENTE e 2 MODERADORES.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizacaoId'
        - $ref: '#/components/parameters/MembroUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [papel]
              properties:
                papel: { $ref: '#/components/schemas/PapelOrganizacao' }
      responses:
        '200':
          description: Papel atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizacaoMembro' }
        '400':
          description: Dados inválidos, alteração do criador ou do próprio papel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Limite de gerentes ou moderadores atingido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Organizações]
      summary: Remove um membro
      description: |
        Exige `requireAuth`. Só CRIADOR, GERENTE ou o ADMIN da plataforma. O
        criador não pode ser removido. Tudo na mesma transação: remove a pessoa
        da equipe de todas as comissões da organização e apaga os convites
        pendentes dela em reuniões não encerradas. Comissão em que ela é o único
        ADMINISTRADOR exige um sucessor (`sucessoresComissao`) ou, se só ela
        compõe a equipe, é apagada (`comissoesApagadas`).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizacaoId'
        - $ref: '#/components/parameters/MembroUserId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sucessoresComissao:
                  type: object
                  description: 'Id da comissão para o id do membro que vira ADMINISTRADOR.'
                  additionalProperties: { type: integer, minimum: 1 }
            example: { sucessoresComissao: { '4': 21 } }
      responses:
        '200':
          description: Membro removido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  comissoesApagadas:
                    type: array
                    items: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Falta indicar quem assume uma comissão. Nada é gravado; o corpo traz `comissoesPendentes` com os membros que podem assumir.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  comissoesPendentes:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        nome: { type: string }
                        organizacaoId: { type: integer }
                        membros:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: integer }
                              name: { type: string }
                              email: { type: string, format: email }
        '500': { $ref: '#/components/responses/InternalError' }

  /organizacoes/{organizacaoId}/comissoes:
    get:
      tags: [Comissões]
      summary: Lista as comissões de uma organização
      description: Exige `requireAuth`. Só membros da organização ou o ADMIN da plataforma.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizacaoIdComissoes' }]
      responses:
        '200':
          description: Comissões, da mais nova para a mais antiga, com a equipe.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Comissao'
                    - type: object
                      properties:
                        equipe:
                          type: array
                          items: { $ref: '#/components/schemas/ComissaoEquipe' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /comissoes:
    post:
      tags: [Comissões]
      summary: Cria uma comissão (UC01)
      description: |
        Exige `requireAuth`. Quem cria precisa ser membro da organização, que
        precisa estar ACEITA. O criador entra como ADMINISTRADOR.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, organizacaoId]
              properties:
                nome: { type: string, maxLength: 80 }
                descricao: { type: string, maxLength: 500 }
                organizacaoId: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Comissão criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comissao' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A organização ainda não foi aprovada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /comissoes/relatorio:
    get:
      tags: [Comissões]
      summary: Relatório de todas as comissões
      description: Exige `requireAuth` + `requireAdmin`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Agregados e lista de comissões.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelatorioComissoes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /comissoes/relatorio/minhas:
    get:
      tags: [Comissões]
      summary: Relatório das comissões em que o usuário está na equipe
      description: Exige `requireAuth`. Mesmo formato do relatório geral.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Agregados e lista de comissões.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelatorioComissoes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /comissoes/{id}:
    get:
      tags: [Comissões]
      summary: Detalha uma comissão (UC02)
      description: |
        Exige `requireAuth`. Só membros da organização ou o ADMIN da
        plataforma. A equipe vem ordenada por papel e depois por nome.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: Id da comissão.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Comissão com a organização e a equipe.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Comissao'
                  - type: object
                    properties:
                      organizacao:
                        type: object
                        properties:
                          id: { type: integer }
                          nome: { type: string }
                      equipe:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/ComissaoEquipe'
                            - type: object
                              properties:
                                user:
                                  $ref: '#/components/schemas/UsuarioResumo'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Comissões]
      summary: Altera nome e descrição de uma comissão (UC02)
      description: |
        Exige `requireAuth`. Só o ADMINISTRADOR ou o FACILITADOR da comissão.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: Id da comissão.
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              properties:
                nome: { type: string, maxLength: 80 }
                descricao:
                  type: string
                  maxLength: 500
                  description: Vazia ou ausente limpa a descrição.
      responses:
        '200':
          description: Comissão atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comissao' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Comissões]
      summary: Exclui uma comissão (UC02)
      description: Exige `requireAuth`. Só o ADMINISTRADOR da comissão.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: Id da comissão.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Comissão excluída.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /comissoes/{comissaoId}/membros:
    post:
      tags: [Comissões]
      summary: Adiciona um membro à equipe (UC03)
      description: |
        Exige `requireAuth`. Só ADMINISTRADOR ou FACILITADOR da comissão; só o
        ADMINISTRADOR adiciona outro ADMINISTRADOR. O usuário precisa ser
        membro da organização.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ComissaoId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: integer, minimum: 1 }
                papel:
                  allOf: [{ $ref: '#/components/schemas/PapelComissao' }]
                  default: MEMBRO
      responses:
        '201':
          description: Membro adicionado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComissaoEquipe' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: O usuário já faz parte da comissão.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /comissoes/{comissaoId}/membros/{userId}:
    patch:
      tags: [Comissões]
      summary: Promove ou rebaixa um membro da equipe (UC03)
      description: |
        Exige `requireAuth`. Só ADMINISTRADOR ou FACILITADOR da comissão;
        facilitador não altera administrador nem promove alguém a
        administrador; a comissão nunca fica sem administrador.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ComissaoId'
        - $ref: '#/components/parameters/MembroUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [papel]
              properties:
                papel: { $ref: '#/components/schemas/PapelComissao' }
      responses:
        '200':
          description: Papel atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComissaoEquipe' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Comissões]
      summary: Remove um membro da equipe (UC03)
      description: |
        Exige `requireAuth`. Só ADMINISTRADOR ou FACILITADOR; facilitador não
        remove administrador; a comissão nunca fica sem administrador.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ComissaoId'
        - $ref: '#/components/parameters/MembroUserId'
      responses:
        '200':
          description: Membro removido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /reunioes/minhas:
    get:
      tags: [Reuniões]
      summary: Lista as reuniões do usuário autenticado
      description: |
        Exige `requireAuth`. Lista reuniões criadas pelo usuário ou para as quais
        ele aceitou o convite. Membros da comissão com convite pendente ou recusado
        não recebem a reunião nesta lista.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Reuniões encontradas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reuniao' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /reunioes/convites:
    get:
      tags: [Reuniões]
      summary: Lista os convites pendentes do usuário autenticado
      description: Exige `requireAuth`. Retorna somente convites ainda não respondidos.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Convites pendentes encontrados.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConviteReuniao' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /reunioes:
    post:
      tags: [Reuniões]
      summary: Cria uma reunião
      description: |
        Exige `requireAuth`. O usuário precisa participar da comissão.
        A reunião e os convites pendentes para os demais membros são criados juntos.
        Os convidados só passam a participar e visualizar a reunião depois de
        aceitarem o convite.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [comissaoId, titulo, pauta, local, data, horaInicio, horaFim]
              properties:
                comissaoId: { type: integer, minimum: 1 }
                convidados:
                  type: array
                  description: IDs dos membros da comissão que receberão convite.
                  uniqueItems: true
                  items: { type: integer, minimum: 1 }
                titulo: { type: string, maxLength: 80 }
                pauta: { type: string, maxLength: 1000 }
                descricao: { type: string, nullable: true, maxLength: 2000 }
                local:
                  type: string
                  maxLength: 500
                  description: Endereço, link da chamada ou os dois (reunião híbrida). Obrigatório.
                data: { type: string, format: date, example: '2026-10-20' }
                horaInicio: { type: string, example: '14:00' }
                horaFim: { type: string, example: '15:00' }
      responses:
        '201':
          description: Reunião criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reuniao' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /reunioes/convites/{inviteId}/responder:
    patch:
      tags: [Reuniões]
      summary: Responde a um convite de reunião
      description: |
        Exige `requireAuth`. O usuário só pode responder ao próprio convite pendente,
        até o horário de término da reunião (fuso TZ_REUNIOES).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: inviteId
          in: path
          required: true
          description: Identificador do convite.
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/StatusConviteReuniao'
      responses:
        '200':
          description: Convite respondido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConviteReuniao' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410':
          {
            description: A reunião já terminou; o convite não pode mais ser respondido.,
          }
        '500': { $ref: '#/components/responses/InternalError' }

  /reunioes/{id}:
    patch:
      tags: [Reuniões]
      summary: Atualiza uma reunião
      description: |
        Pode editar o criador (se a conta ainda existir), o Administrador atual da
        comissão e o ADMIN da plataforma. Reunião já encerrada pelo horário não é
        alterada (409).
        Se a data ou o horário mudarem, o criador e os convidados que não recusaram
        recebem a notificação "Reunião remarcada"; se só os detalhes mudarem,
        "Reunião atualizada". Quem fez a edição não é notificado, e salvar sem
        mudanças não gera notificação.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, pauta, local, data, horaInicio, horaFim]
              properties:
                titulo: { type: string, maxLength: 80 }
                pauta: { type: string, maxLength: 1000 }
                descricao: { type: string, nullable: true, maxLength: 2000 }
                local:
                  type: string
                  maxLength: 500
                  description: Endereço, link da chamada ou os dois (reunião híbrida). Obrigatório.
                data: { type: string, format: date }
                horaInicio: { type: string, example: '14:00' }
                horaFim: { type: string, example: '15:00' }
      responses:
        '200':
          description: Reunião atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reuniao' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A reunião já terminou e não pode mais ser alterada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Reuniões]
      summary: Remove uma reunião
      description: |
        Pode remover o criador (se a conta ainda existir), o Administrador atual
        da comissão e o ADMIN da plataforma, mesmo com a reunião encerrada.
        Na mesma transação, antes de apagar, o criador e os convidados que não
        recusaram recebem a notificação "Reunião excluída". A reunião, os convites
        e os registros de presença são apagados; as notificações permanecem.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Reunião removida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /reunioes/{id}/arquivos:
    get:
      tags: [Reuniões]
      summary: Lista a biblioteca de arquivos da reunião
      description: |
        Exige `requireAuth`. Participante (criador ou convite aceito) ou quem
        gere a reunião. `podeEnviar` é verdadeiro só para quem gere, e só
        enquanto a reunião não terminou e não foi cancelada.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Arquivos, do mais antigo para o mais novo.
          content:
            application/json:
              schema:
                type: object
                required: [podeEnviar, arquivos]
                properties:
                  podeEnviar: { type: boolean }
                  arquivos:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        nome: { type: string }
                        tamanhoBytes: { type: integer }
                        createdAt: { type: string, format: date-time }
                        enviadoPor:
                          nullable: true
                          allOf:
                            - $ref: '#/components/schemas/UsuarioResumo'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Reuniões]
      summary: Envia um arquivo para a biblioteca
      description: |
        Exige `requireAuth`. Só quem gere a reunião, e só antes do término ou
        do cancelamento. Corpo binário de até 25 MB, qualquer tipo. O nome
        original vai no cabeçalho `X-Nome-Arquivo`, codificado com
        encodeURIComponent.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: X-Nome-Arquivo
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Arquivo gravado.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413':
          description: Arquivo acima de 25 MB.
        '500': { $ref: '#/components/responses/InternalError' }

  /reunioes/{id}/arquivos/{arquivoId}:
    get:
      tags: [Reuniões]
      summary: Baixa um arquivo da biblioteca
      description: |
        Exige `requireAuth`. Quem pode ver a reunião baixa o arquivo, antes,
        durante e depois dela. A resposta é o conteúdo binário, sem abrir no
        aplicativo.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: arquivoId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Conteúdo do arquivo.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Reuniões]
      summary: Apaga um arquivo da biblioteca
      description: |
        Exige `requireAuth`. Só quem gere a reunião, e só antes do término ou
        do cancelamento.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: arquivoId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Arquivo apagado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /reunioes/{id}/convites:
    post:
      tags: [Reuniões]
      summary: Convida membros para uma reunião existente
      description: Pode convidar o criador (se a conta ainda existir), o Administrador atual da comissão e o ADMIN da plataforma. Convites já existentes são ignorados.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [convidados]
              properties:
                convidados:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Convites enviados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /reunioes/{id}/entrar:
    post:
      tags:
        - Reuniões
      summary: Registra a primeira entrada do integrante na reunião
      description:
        Exige autenticação, vínculo atual com a comissão de organização
        aprovada e convite aceito (ou autoria da reunião). Código de presença
        obrigatório. Horário e identidade vêm do servidor. Antes do início retorna
        400; código ausente ou inválido retorna 400. Reunião cancelada retorna
        409. Repetições preservam os horários e retornam o mesmo registro. Novas
        entradas próprias somente do início até antes do término, em reunião
        AGENDADA. Ata finalizada não admite novas presenças.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Presença já registrada; o horário original foi preservado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntradaReuniao'
        '201':
          description: Primeira entrada registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntradaReuniao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Estado incompatível com a operação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Limite de tentativas de presença atingido.
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - codigoPresenca
              properties:
                codigoPresenca:
                  type: string
                  pattern: ^[0-9]{6}$
                  description: Código informado pelo administrador da comissão.

  /reunioes/{id}/sair:
    post:
      tags:
        - Reuniões
      summary: Registra a saída do integrante da reunião
      description:
        Exige autenticação, vínculo atual com a comissão de organização
        aprovada e convite aceito (ou autoria da reunião). Código de presença
        obrigatório. Horário e identidade vêm do servidor. Antes do início retorna
        400; código ausente ou inválido retorna 400. Reunião cancelada retorna
        409. Repetições preservam os horários e retornam o mesmo registro. Exige
        entrada prévia (409 sem ela). Permite saída após o término.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description:
            Saída registrada, ou já registrada antes (`jaRegistrado` = true,
            horário original preservado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntradaReuniao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Estado incompatível com a operação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Limite de tentativas de presença atingido.
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - codigoPresenca
              properties:
                codigoPresenca:
                  type: string
                  pattern: ^[0-9]{6}$
                  description: Código informado pelo administrador da comissão.

  /reunioes/{id}/lista-presenca:
    get:
      tags: [Reuniões]
      summary: Consultar a lista real de presença
      description: Disponível ao administrador da plataforma, criador da reunião ou administrador atual da comissão.
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: integer, minimum: 1 },
          }
      responses:
        '200':
          description: >-
            Participantes, horários de entrada e saída persistidos, observações e
            eventos por reunião. Inclui estado calculado pelo horário e podeExportar;
            esta última propriedade só é verdadeira após o encerramento.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: integer, minimum: 1 },
        }

  /reunioes/{id}/lista-presenca/{userId}:
    patch:
      tags: [Reuniões]
      summary: Atualizar marcação e/ou observações de um participante
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: integer, minimum: 1 },
          }
        - {
            name: userId,
            in: path,
            required: true,
            schema: { type: integer, minimum: 1 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  { type: string, enum: [PRESENTE, AUSENTE, SEM_MARCACAO] }
                observacao:
                  {
                    type: string,
                    maxLength: 2000,
                    description: Observação persistida por participante e reunião.,
                  }
      responses:
        '200': { description: Lista atualizada com a marcação persistida. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reunioes/{id}/lista-presenca/{userId}/eventos:
    post:
      tags: [Reuniões]
      summary: Registrar saída ou retorno de um participante
      description: O horário HH:mm é interpretado na data e no fuso TZ_REUNIOES da reunião. Saídas exigem presença marcada ou entrada registrada; eventos precisam alternar saída e retorno.
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: integer, minimum: 1 },
          }
        - {
            name: userId,
            in: path,
            required: true,
            schema: { type: integer, minimum: 1 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, hora]
              properties:
                tipo: { type: string, enum: [SAIDA, RETORNO] }
                hora: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
                motivo:
                  {
                    type: string,
                    maxLength: 500,
                    description: Opcional e usado apenas em uma saída.,
                  }
      responses:
        '201': { description: Evento registrado no histórico da lista. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          { description: O horário ou a sequência de eventos não é válida. }

  /reunioes/{id}/ata:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Reuniões]
      summary: Consulta a ata e os totais da votação
      description: |
        Exige JWT e vínculo atual com a comissão, com entrada registrada nesta reunião.
        A saída registrada não revoga o acesso. Os quatro cargos podem ler.
        ADMIN da plataforma não ignora as restrições. A resposta informa o cargo,
        permissões e o voto do solicitante, sem expor os votos individuais de terceiros.
        Traz `presentes`, `aprovada` (maioria simples dos presentes, calculada),
        `exportada`, `exportadaAt` e `podeExportar`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Ata, permissões e votação atual. conteudoAta nulo se ainda não redigida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ata' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Reuniões]
      summary: Redige ou edita a ata da reunião
      description: |
        requireAuth e requireAtaEditor conferem a identidade do JWT, o cargo atual
        ADMINISTRADOR ou SECRETARIO na comissão e o registro de entrada na reunião.
        FACILITADOR e MEMBRO recebem 403, inclusive quando o perfil global é ADMIN.
        HTML é sanitizado antes de salvar; texto vazio após sanitização recebe 400.
        Preserva formatação textual e tabelas simples. Atributos permitidos:
        style com text-align (left, center, right, justify) e font-size
        (10, 13, 16, 18, 24, 32 ou 48px), data-ata-border
        (all, outer, inner, horizontal, vertical, top, bottom, left, right, none)
        e colspan/rowspan de 1 a 10. Fontes legadas do editor móvel são normalizadas.
        Scripts, outros estilos, eventos e recursos externos são removidos.
        Alterar o texto incrementa versaoAta e remove os votos na mesma transação.
        Salvar conteúdo idêntico preserva a versão e os votos. Versão desatualizada
        e ata já exportada recebem 409.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conteudoAta, versaoAta]
              properties:
                conteudoAta: { type: string, minLength: 1, maxLength: 50000 }
                versaoAta: { type: integer, minimum: 0 }
            example:
              {
                conteudoAta: '<p><strong>Decisão:</strong> aprovar o cronograma.</p>',
                versaoAta: 0,
              }
      responses:
        '200':
          description: Ata salva e votação atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ata' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /reunioes/{id}/ata/votar:
    post:
      tags: [Reuniões]
      summary: Aprova ou reprova a versão salva da ata
      description: |
        Exige JWT, vínculo atual com a comissão e entrada registrada na reunião,
        independentemente da saída. Os quatro cargos podem votar, incluindo quem redige.
        A ata precisa estar salva. Identidade vem do JWT, nunca do corpo.
        Há um voto por usuário e reunião; repetir ou trocar o voto atualiza esse registro.
        A versão enviada precisa ser a atual, inclusive sob edição concorrente.
        Qualquer integrante com entrada registrada vota, não só quem preside.
        Depois da exportação a ata não aceita mais voto (409).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, versaoAta]
              properties:
                status: { type: string, enum: [APROVADO, REPROVADO] }
                versaoAta: { type: integer, minimum: 0 }
            example: { status: APROVADO, versaoAta: 1 }
      responses:
        '200':
          description: Voto registrado ou atualizado, com os totais atuais.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ata' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ata ainda não redigida ou versão desatualizada; consultar novamente antes de votar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /reunioes/{id}/ata/exportar:
    post:
      tags:
        - Reuniões
      summary: Exporta a ata aprovada e a torna imutável
      description: >-
        Exige JWT, vínculo atual com a comissão e entrada registrada na reunião.

        Só com a ata aprovada: mais da metade dos presentes (maioria simples; a

        metade exata não aprova) votou APROVADO na versão atual. Grava

        `ataExportadaAt` e `ataVersaoExportada`. Depois disso, editar a ata e

        votar respondem 409. Repetir a chamada é idempotente e não altera a data.
         A versão enviada deve ser a mesma do PDF; versão desatualizada retorna 409. O aplicativo notifica após gerar o arquivo. No navegador, o usuário confirma que salvou ou imprimiu; cancelamento não finaliza. Finalização, edição, votos e novas presenças são serializados pelo bloqueio da reunião.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Ata exportada (ou já exportada antes), com `exportada` = true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A ata ainda não foi aprovada, ou a versão mudou durante a exportação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - versaoAta
              properties:
                versaoAta:
                  type: integer
                  minimum: 0
                  description: Versão utilizada no PDF gerado com sucesso.

  /reunioes/{id}/resultados:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Votações]
      summary: Relatório dos resultados da reunião
      description: |
        Exige `requireAuth`. Só depois que o horário de fim da reunião passa (409
        antes disso). Participante vê os totais de cada votação. Quem gere a
        reunião também vê quem votou em cada opção quando a votação é ABERTA.
        Votação SECRETA não traz `userId` nem nome de quem votou, para ninguém.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Placar oficial da reunião.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelatorioVotacao' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A reunião ainda não terminou.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /reunioes/{id}/votacoes:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Votações]
      summary: Lista as votações da reunião
      description: |
        Exige `requireAuth`. Participantes da reunião (criador ou convite aceito) e
        quem a gere (criador, Administrador atual da comissão e ADMIN) veem a lista.
        Nenhuma estrutura traz `userId` de quem votou. `encerrada` é verdadeiro
        também quando a reunião terminou ou foi cancelada.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Votações da reunião, da mais recente para a mais antiga.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VotacaoResumo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Votações]
      summary: Cria uma votação na reunião
      description: |
        Exige `requireAuth`. Só quem gere a reunião: criador, Administrador atual
        da comissão ou ADMIN da plataforma. Pode ser criada antes ou durante a
        reunião, mas não depois do fim nem em reunião cancelada (409). O `tipo`,
        `mostrarParcial` e `permiteTrocaVoto` não mudam depois. O voto nulo está
        sempre disponível.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VotacaoCriacao' }
      responses:
        '201':
          description: Votação criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Votacao' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A reunião já terminou ou foi cancelada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /votacoes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Votações]
      summary: Consulta uma votação e o resultado
      description: |
        Exige `requireAuth`. Com `mostrarParcial` falso, os totais por opção e
        `nulos` só aparecem depois do encerramento; antes só `totalVotos` e
        `votei`. Em votação ABERTA, `votantes` (quem votou em quê) só vai para quem
        gere. Em votação SECRETA nenhuma rota devolve a ligação entre voto e
        pessoa, nem ao Administrador da comissão; `meuVotoOpcaoId` e
        `meuVotoNulo` só dizem respeito a quem pede.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Votação.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Votacao' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Votações]
      summary: Exclui uma votação
      description: Exige `requireAuth`. Só quem gere a reunião. Permitido mesmo com a votação encerrada.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Votação removida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /votacoes/{id}/voto:
    post:
      tags: [Votações]
      summary: Vota ou troca o voto
      description: |
        Exige `requireAuth`. Só participantes (criador ou convite aceito) que
        registraram entrada, ainda não registraram saída e com a reunião em
        andamento. ADMIN da plataforma que não participa não vota. Corpo: uma
        opção (`opcaoId`) ou o voto nulo (`nulo: true`), nunca os dois. Trocar o
        voto só com `permiteTrocaVoto`; sem ele o segundo voto recebe 409. A
        votação encerrada (gravada ou pelo fim da reunião) recebe 410.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                opcaoId: { type: integer, minimum: 1 }
                nulo:
                  {
                    type: boolean,
                    description: 'Verdadeiro registra voto nulo; não envie junto com `opcaoId`.',
                  }
            examples:
              opcao: { value: { opcaoId: 12 } }
              nulo: { value: { nulo: true } }
      responses:
        '200':
          description: Voto registrado, com a votação atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Votacao' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Sem entrada registrada, saída já registrada, reunião ainda não começou ou troca de voto não permitida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410': { $ref: '#/components/responses/Gone' }
        '500': { $ref: '#/components/responses/InternalError' }

  /votacoes/{id}/encerrar:
    post:
      tags: [Votações]
      summary: Encerra a votação
      description: Exige `requireAuth`. Só quem gere a reunião. Encerrar de novo é idempotente e não há volta.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Votação encerrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Votacao' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /notificacoes:
    get:
      tags: [Notificações]
      summary: Lista as notificações do usuário autenticado
      description: Exige `requireAuth`. Retorna as 50 mais recentes, da mais nova para a mais antiga.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Notificações encontradas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notificacao' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

    delete:
      tags: [Notificações]
      summary: Remove todas as notificações do usuário autenticado
      description: Exige `requireAuth`. Não mexe em convites pendentes.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Quantidade de notificações removidas.
          content:
            application/json:
              schema:
                type: object
                required: [removidas]
                properties:
                  removidas: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /notificacoes/lidas:
    patch:
      tags: [Notificações]
      summary: Marca como lidas todas as notificações do usuário autenticado
      description: Exige `requireAuth`. Só altera as que ainda não foram lidas.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Quantidade de notificações marcadas como lidas.
          content:
            application/json:
              schema:
                type: object
                required: [lidas]
                properties:
                  lidas: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /notificacoes/{id}:
    delete:
      tags: [Notificações]
      summary: Remove uma notificação do usuário autenticado
      description: |
        Exige `requireAuth`. Notificação de outro usuário responde 404, como se
        não existisse.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Notificação removida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /convites/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: Token secreto do convite, enviado só no e-mail ao convidado.
        schema: { type: string }
    get:
      tags: [Reuniões]
      summary: Página de resposta aberta pelos botões Aceitar/Recusar do e-mail
      description: |
        Pública: o token faz o papel do login. Devolve HTML. Só mostra o convite
        e pede confirmação; nunca grava a resposta, porque leitores de e-mail
        visitam os links antes do usuário clicar.
      parameters:
        - name: resposta
          in: query
          required: false
          schema: { type: string, enum: [aceitar, recusar] }
      responses:
        '200':
          {
            description: Página de confirmação,
            de escolha ou de convite já respondido.,
          }
        '404': { description: Token inválido ou reunião excluída. }
        '409': { description: Reunião cancelada. }
        '410':
          {
            description: A reunião já terminou; o link não aceita mais respostas.,
          }
    post:
      tags: [Reuniões]
      summary: Confirma a resposta ao convite pelo botão da página
      description: |
        Pública: o token faz o papel do login. Recebe um formulário HTML e
        devolve HTML. Aplica as mesmas regras de
        PATCH /reunioes/convites/{inviteId}/responder (convite respondido não muda).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [resposta]
              properties:
                resposta: { type: string, enum: [aceitar, recusar] }
      responses:
        '200': { description: Resposta registrada. }
        '400': { description: Resposta inválida. }
        '404': { description: Token inválido ou reunião excluída. }
        '409': { description: Convite já respondido ou reunião cancelada. }
        '410': { description: A reunião já terminou. }

  /reunioes/{id}/codigo-presenca:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags:
        - Reuniões
      summary: Consulta o código de presença
      description:
        Somente ADMINISTRADOR atual da comissão. ADMIN global não substitui
        este papel. Reuniões anteriores à migração podem retornar código nulo; use
        POST para gerar.
      security:
        - bearerAuth: []
      responses:
        '200': &a1
          description: Código restrito ao administrador atual da comissão.
          content:
            application/json:
              schema:
                type: object
                properties:
                  codigoPresenca:
                    type: string
                    nullable: true
                    pattern: ^[0-9]{6}$
        '400': &a2
          $ref: '#/components/responses/BadRequest'
        '401': &a3
          $ref: '#/components/responses/Unauthorized'
        '403': &a4
          $ref: '#/components/responses/Forbidden'
        '404': &a5
          $ref: '#/components/responses/NotFound'
        '409': &a6
          description: Estado incompatível com a operação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': &a7
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Reuniões
      summary: Gera ou renova o código de presença
      description: Somente ADMINISTRADOR atual da comissão. Gera seis dígitos
        aleatórios e invalida imediatamente o código anterior. Corpo vazio.
      security:
        - bearerAuth: []
      responses:
        '200': *a1
        '400': *a2
        '401': *a3
        '403': *a4
        '404': *a5
        '409': *a6
        '429':
          description: Limite de tentativas atingido.
        '500': *a7

  /reunioes/{id}/participantes/{userId}/entrar:
    post:
      tags:
        - Reuniões
      summary: Registra entrada pelo participante
      description: Somente ADMINISTRADOR atual da comissão. O participante deve
        integrar a comissão e ter aceitado o convite (ou criado a reunião). Sem
        PIN ou biometria do participante. Usa horário do servidor e grava a
        autoria manual. Antes do início retorna 400. Cancelada retorna 409; saída
        sem entrada retorna 409. Repetições são idempotentes. Permite correções
        após o término, mas não adiciona presenças depois de finalizar a ata.
        Corpo vazio.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Registro efetuado ou já existente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntradaReuniao'
        '201':
          description: Primeira entrada registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntradaReuniao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Estado incompatível com a operação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /reunioes/{id}/participantes/{userId}/sair:
    post:
      tags:
        - Reuniões
      summary: Registra saída pelo participante
      description: Somente ADMINISTRADOR atual da comissão. O participante deve
        integrar a comissão e ter aceitado o convite (ou criado a reunião). Sem
        PIN ou biometria do participante. Usa horário do servidor e grava a
        autoria manual. Antes do início retorna 400. Cancelada retorna 409; saída
        sem entrada retorna 409. Repetições são idempotentes. Permite correções
        após o término, mas não adiciona presenças depois de finalizar a ata.
        Corpo vazio.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Registro efetuado ou já existente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntradaReuniao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Estado incompatível com a operação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
